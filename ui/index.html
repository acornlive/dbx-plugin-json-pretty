<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON 格式化工具</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="toolbar" id="jsonToolbar">
      <!-- 工作区开关：« 表示当前是展开的（点了收起） / » 表示已收起（点了展开） -->
      <button class="btn btn-primary ws-toggle-btn" id="wsToggleBtn" data-action="ws-toggle" title="收起工作区">
        <span data-i18n="ws_title">工作区</span>
        <span class="ws-icon" id="wsStateIcon">》</span>
      </button>
      <button class="btn btn-primary" data-action="format" data-i18n="format">格式化</button>
      <button class="btn" data-action="compress" data-i18n="compress">压缩</button>
      <button class="btn" data-action="escape" data-i18n="escape">转义</button>
      <button class="btn" data-action="unescape" data-i18n="unescape">去转义</button>
      <button class="btn" data-action="collapse" data-i18n="collapse_all">全部折叠</button>
      <button class="btn" data-action="expand" data-i18n="expand_all">全部展开</button>
      <button class="btn" data-action="clear" data-i18n="clear">清空</button>
    </div>

    <div class="split" id="split">
      <aside class="pane tree-pane" id="treePane">
        <div class="pane-title" id="treeHead">
          <span data-i18n="ws_title">工作区</span>
          <label class="ws-switch" data-i18n-title="ws_save_title" title="开启后：拖拽或粘贴的 JSON 会自动保存到工作区；关闭则用完即走，不落盘">
            <input type="checkbox" id="wsSaveToggle" />
            <span class="ws-track"><span class="ws-knob"></span></span>
            <span data-i18n="ws_save">保存</span>
          </label>
        </div>
        <div id="treeList" class="tree-list"></div>
      </aside>

      <div class="resizer" id="resizerTree" data-i18n-title="tree_resizer_title" title="拖动调整工作区宽度"></div>

      <div class="pane" id="paneLeft">
        <div class="pane-title">
          <span data-i18n="raw_data">原始数据（可编辑）</span>
          <span class="pane-actions">
            <span class="counter" id="inputCounter" data-i18n="counter">0 字符</span>
            <button class="mini-btn" data-action="copy-input" data-i18n="copy" data-i18n-title="copy_input_title" title="复制原始数据">复制</button>
          </span>
        </div>
        <textarea id="jsonInput" class="editor" spellcheck="false" data-i18n-ph="placeholder" placeholder='在此粘贴 JSON，或拖拽文件到此处'></textarea>
      </div>

      <div class="resizer" id="resizer" data-i18n-title="resizer_title" title="拖动调整左右宽度"></div>

      <div class="pane" id="paneRight">
        <div class="pane-title">
          <!-- 嵌套解析：值里如果有 JSON 文本（body / payload 常见），要不要递归当成 JSON 展开 -->
          <label class="ws-switch" data-i18n-title="deep_parse_title" title="把值里的 JSON 文本（如 body）递归解析成可展开的树">
            <input type="checkbox" id="deepParseToggle" />
            <span class="ws-track"><span class="ws-knob"></span></span>
            <span data-i18n="deep_parse">嵌套解析</span>
          </label>
          <span class="pane-actions">
            <span class="level-label" data-i18n="expand_label">展开</span>
            <span id="levelButtons" class="level-buttons"></span>
            <button class="mini-btn" data-action="search" data-i18n="search_toggle" data-i18n-title="search_toggle_title" title="在结果搜索 key（Ctrl+F）">搜索</button>
            <button class="mini-btn" data-action="copy" data-i18n="copy" data-i18n-title="copy_output_title" title="复制结果全部内容">复制</button>
          </span>
        </div>
        <!-- 浮动搜索框：浮在结果区内容之上，搜 key 与 value，命中自动展开并高亮 -->
        <div id="searchBox" class="search-box" hidden>
          <span class="search-field">
            <input id="searchInput" class="search-input" type="text" spellcheck="false"
                   data-i18n-ph="search_ph" data-i18n-title="search_input_title"
                   placeholder="搜索 key 或值…" title="搜索 key 与值" />
            <!-- 只有输入框里有内容才出现：一键清空搜索词，搜索框本身保持打开 -->
            <button id="searchClear" class="search-clear" type="button" hidden
                    data-action="search-clear" data-i18n-title="search_clear"
                    title="清空搜索词" aria-label="清空搜索词">×</button>
          </span>
          <button class="search-btn" type="button" data-action="search-regex"
                  data-i18n-title="search_regex_title" title="按正则搜索" aria-label="按正则搜索">.*</button>
          <button class="search-btn" type="button" data-action="search-case"
                  data-i18n-title="search_case_title" title="区分大小写" aria-label="区分大小写">Aa</button>
          <span id="searchCount" class="search-count">0 / 0</span>
          <button class="search-btn" type="button" data-action="search-prev" data-i18n-title="search_prev" title="上一个匹配" aria-label="上一个匹配">↑</button>
          <button class="search-btn" type="button" data-action="search-next" data-i18n-title="search_next" title="下一个匹配" aria-label="下一个匹配">↓</button>
          <button class="search-btn" type="button" data-action="search-close" data-i18n-title="search_close" title="关闭搜索" aria-label="关闭搜索">×</button>
        </div>
        <div id="jsonOutput" class="json-view">
          <div id="jvCanvas" class="jv-canvas" hidden><div id="jvRows" class="jv-rows"></div></div>
          <pre id="jvPlain" class="jv-plain" hidden></pre>
        </div>
      </div>
    </div>
  </div>

  <!-- 拖放遮罩 -->
  <div id="dropOverlay" class="drop-overlay" hidden>
    <div class="drop-box">
      <span class="drop-icon">📂</span>
      <span class="drop-text" data-i18n="drop_hint">释放鼠标以导入 JSON 文件</span>
    </div>
  </div>

  <!-- 右键上下文菜单 -->
  <div id="ctxMenu" class="ctx-menu" role="menu" hidden>
    <button class="ctx-item" data-act="copy-sel" role="menuitem" data-i18n="ctx_copy">复制</button>
    <button class="ctx-item" data-act="paste" role="menuitem" data-i18n="ctx_paste">粘贴</button>
    <button class="ctx-item" data-act="clear-input" role="menuitem" data-i18n="clear">清空</button>
  </div>

  <script src="i18n.js"></script>
  <script src="core.js"></script>
  <script src="model.js"></script>
  <script src="view.js"></script>
  <script src="workspace.js"></script>
  <script src="app.js"></script>
</body>
</html>
