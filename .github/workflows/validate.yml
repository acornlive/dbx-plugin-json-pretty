name: Check DBX plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Go 1.20
        run: |
          curl -sL -o /tmp/go.tar.gz https://go.dev/dl/go1.20.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check Go formatting
        run: cd backend && test -z "$(gofmt -l .)"

      - name: Go vet
        run: cd backend && go vet ./...

      - name: Build Go backend
        run: cd backend && go build -o /dev/null .

      - name: Verify manifest and backend identity
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const source = fs.readFileSync("backend/main.go", "utf8");
          const backendId = source.match(/pluginID\s*=\s*"([^"]+)"/)?.[1];
          const backendVersion = source.match(/pluginVersion\s*=\s*"([^"]+)"/)?.[1];
          if (!backendId || !backendVersion) throw new Error("Backend identity constants are missing");
          if (manifest.id !== backendId) throw new Error(`ID mismatch: manifest=${manifest.id} backend=${backendId}`);
          if (manifest.version !== backendVersion) throw new Error(`Version mismatch: manifest=${manifest.version} backend=${backendVersion}`);
          console.log("✓ manifest.json ≡ backend/main.go  identity:", manifest.id, manifest.version);
          NODE

      - name: Inspect local go.mod
        run: cat backend/go.mod

      - name: Cross-compile Go backend (linux-x64)
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bin/jsonpretty ./backend

      - name: Package Linux candidate
        run: |
          node -e "
          const fs = require('fs');
          const raw = fs.readFileSync('dbx-plugin.toml','utf8');
          const lines = raw.split(/\r?\n/);
          let skip = false;
          const out = lines.filter(line => {
            if (line.startsWith('[backend]')) { skip = true; return false; }
            if (skip && (line.startsWith('[') || /^schema_version/.test(line))) skip = false;
            return !skip;
          }).join('\n');
          fs.writeFileSync('dbx-plugin.toml', out + '\n');
          "

          npx --yes @dbx-app/plugin-cli@0.1.9 package . --target linux-x64 --output-dir dist

          # 恢复原始 toml
          git checkout dbx-plugin.toml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: json-pretty-linux-x64
          path: dist/